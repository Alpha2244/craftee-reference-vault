name: Harvest & Analyze @craftee_films Reels

on:
  workflow_dispatch:
    inputs:
      max_reels:
        description: "Number of new Reels to scrape & analyze in this run"
        required: false
        default: "5"
  schedule:
    - cron: "0 12 */2 * *"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Reference Vault Repo
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ -f requirements.txt ]; then
            pip install -q -r requirements.txt
          else
            pip install -q "faster-whisper>=1.0.3" "yt-dlp>=2024.10.22" "curl_cffi>=0.7.0" "Pillow>=10.0.0" "numpy>=1.26.0"
          fi

      - name: 3. Scrape Public Reels from @craftee_films (Cookie-Free)
        env:
          IG_TARGET_USER: "craftee_films"
          MAX_REELS_PER_RUN: ${{ github.event.inputs.max_reels || '5' }}
        run: |
          SCRIPT=$(find . -maxdepth 3 -name "scrape_ig.py" | head -n 1)
          test -n "$SCRIPT" || { echo "scrape_ig.py not found"; exit 1; }
          python "$SCRIPT"

      - name: 4. Transcribe Audio & Extract Camera Cut Keyframes
        run: |
          SCRIPT=$(find . -maxdepth 3 -name "extract_and_transcribe.py" | head -n 1)
          test -n "$SCRIPT" || { echo "extract_and_transcribe.py not found"; exit 1; }
          python "$SCRIPT"

      - name: 5. Reverse-Engineer Hooks, Cameras & Outfits (Multi-Model Defensive)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SCRIPT=$(find . -maxdepth 3 -name "analyze_reel.py" | head -n 1)
          test -n "$SCRIPT" || { echo "analyze_reel.py not found"; exit 1; }
          python "$SCRIPT"

      - name: 6. Commit Transcripts, Keyframes & Style Blueprints to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p vault/raw_meta vault/transcripts vault/frames vault/blueprints
          git add vault/raw_meta vault/transcripts vault/frames vault/blueprints
          if ! git diff --cached --quiet; then
            git commit -m "Harvested & analyzed new @craftee_films reference blueprints"
            git push
          else
            echo "No new blueprints to commit."
          fi
